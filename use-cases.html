<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Use Cases | Conscience IQ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Conscience IQ home">CONSCIENCE IQ</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">Menu</button>
      <nav id="site-menu" class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="https://www.conscienceiq.com/use-cases">Use Cases</a>
      </nav>
    </header>

    <main class="use-cases-shell">
      <iframe
        id="use-cases-frame"
        title="Conscience IQ Use Cases"
        src="use-cases-embed/use-cases.html"
        loading="eager"
      ></iframe>
    </main>

    <footer class="site-footer">
      <img src="Images/footerBreak_1280-ezgif.com-webp-to-png-converter (1).png" alt="" />
      <div class="footer-panel">
        <a class="footer-brand" href="index.html">CONSCIENCE IQ</a>
        <form>
          <div>
            <input id="email" type="email" placeholder="ENTER EMAIL" />
            <button type="submit">SUBSCRIBE</button>
          </div>
        </form>
        <p class="footer-copyright">2025 &copy; Conscience IQ | All Rights Reserved</p>
      </div>
    </footer>

    <script src="script.js"></script>
    <script>
      const useCasesFrame = document.getElementById("use-cases-frame");

      window.addEventListener("message", (event) => {
        if (event.data?.source !== "ciq-use-case" || event.data.type !== "resize") {
          return;
        }

        useCasesFrame.style.height = `${event.data.height}px`;
      });
    </script>
  </body>
</html>
