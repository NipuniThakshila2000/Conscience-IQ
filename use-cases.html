<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Use Cases | Conscience IQ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Conscience IQ home">CONSCIENCE IQ</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">Menu</button>
      <nav id="site-menu" class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="use-cases.html">Use Cases</a>
      </nav>
    </header>

    <main class="use-cases-shell">
      <iframe
        id="use-cases-frame"
        title="Conscience IQ Use Cases"
        src="use-cases-embed/use-cases.html"
        loading="eager"
      ></iframe>
    </main>

    <script src="script.js"></script>
    <script>
      const useCasesFrame = document.getElementById("use-cases-frame");

      window.addEventListener("message", (event) => {
        if (event.data?.source !== "ciq-use-case" || event.data.type !== "resize") {
          return;
        }

        useCasesFrame.style.height = `${event.data.height}px`;
      });
    </script>
  </body>
</html>
